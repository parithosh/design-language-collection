name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs --check
      - run: zip -r design-${{ github.ref_name }}.zip dist assets lib tokens principles LICENSE README.md
      - run: gh release create "${{ github.ref_name }}" design-${{ github.ref_name }}.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
