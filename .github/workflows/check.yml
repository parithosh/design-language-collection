name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails when dist/ is stale, a contrast pair is below its floor, or a Pallu fabric needs adjusting.
      - run: node build.mjs --check
